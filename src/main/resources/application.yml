spring:
  application:
    name: liftonway-backend
  jackson:
    # Dates go out as ISO-8601 with their offset, e.g. 2026-10-20T08:00:00+05:00.
    time-zone: Asia/Karachi
  # The database comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD when deployed;
  # `bootRun` and the tests start an embedded PostgreSQL instead.
  threads:
    virtual:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

# API docs are a development aid: off unless the dev profile turns them on.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /docs

liftonway:
  # The zone ride dates are interpreted in ("rides on 20 October" means Pakistan's 20 October).
  zone: Asia/Karachi
  jwt:
    # Required outside dev and test: a random value of at least 32 bytes, from a secret store. Never commit one.
    secret: ${LIFTONWAY_JWT_SECRET:}
    # Access tokens are short-lived; refresh tokens rotate on every use and end the sign-in if reused.
    ttl: 15m
    refresh-ttl: 60d
  otp:
    length: 4
    ttl: 5m
    max-attempts: 5
    resend-after: 30s
    max-per-hour: 5
  cancellation-cutoff: 4h
