# Local PostgreSQL for development. `./gradlew bootRun` starts it automatically (Spring Boot Docker Compose support).
# The password is a local-only placeholder for a database bound to localhost; never reuse it anywhere else.
services:
  postgres:
    image: "postgres:17-alpine"
    environment:
      POSTGRES_DB: liftonway
      POSTGRES_USER: liftonway
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
